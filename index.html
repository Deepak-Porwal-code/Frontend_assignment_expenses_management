<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f6f8" />
    <meta
      name="description"
      content="Moneta is a calm, private expense tracker for understanding your money — budgets, analytics, goals and recurring transactions in one place."
    />
    <meta property="og:title" content="Moneta — Your money, in focus" />
    <meta property="og:description" content="A beautifully simple expense tracker built for clarity." />
    <title>Moneta — Your money, in focus</title>
    <script>
      (function () {
        try {
          var setting = localStorage.getItem('moneta-theme') || 'system';
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = setting === 'system' ? (prefersDark ? 'dark' : 'light') : setting;
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
